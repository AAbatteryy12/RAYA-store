<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raya Store — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--pink:#d6336c;--pink2:#f06595;--pink-soft:#fce4ee;--bg:#fdf4f8;--ink:#2a2227;--mut:#7b6b73;--line:#f0dbe5;--ok:#2f9e44}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:92px}
h1,h2,h3,.fred{font-family:"Fredoka","Nunito",sans-serif;letter-spacing:0}
button{font-family:inherit;cursor:pointer}
img{display:block}
.hdr{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--pink),#e64980);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;box-shadow:0 2px 10px rgba(214,51,108,.25)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--pink);display:flex;align-items:center;justify-content:center;font:700 20px "Fredoka",sans-serif}
.brand h1{font-size:20px;font-weight:600;line-height:1.1}.brand small{display:block;font-size:11px;opacity:.9}
.cart-btn{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center}
.cart-btn svg{width:24px;height:24px}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#fff;color:var(--pink);font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 0}
.state{background:#fff;border-radius:18px;padding:26px 18px;text-align:center;color:var(--mut);margin-top:16px;box-shadow:0 4px 14px rgba(214,51,108,.08)}
/* ads */
.ads{position:relative;margin-bottom:6px}
.ads-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ads-track::-webkit-scrollbar{display:none}
.ad{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/7;background:var(--pink-soft)}
.ad img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#e8c5d5;border:0;padding:0;transition:all .2s}
.dot.on{background:var(--pink);width:22px;border-radius:5px}
/* sections */
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:19px;font-weight:600;color:var(--pink)}
.sec-h .sub{font-size:12px;color:var(--mut)}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hrow::-webkit-scrollbar{display:none}
.hrow>.card{flex:0 0 150px;scroll-snap-align:start}
.cat.expanded .hrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible}
.cat.expanded .hrow>.card{flex:none}
.cat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;background:#fff;border-radius:14px;padding:10px 14px;border:0;width:100%;text-align:left;box-shadow:0 3px 10px rgba(214,51,108,.07)}
.cat-h .n{font:600 17px "Fredoka",sans-serif;color:var(--ink)}
.cat-h .c{font-size:12px;color:var(--mut);margin-left:8px;font-family:"Nunito",sans-serif;font-weight:600}
.cat-h .x{font-size:12px;font-weight:800;color:var(--pink);background:var(--pink-soft);border-radius:999px;padding:6px 12px;white-space:nowrap}
.cat{margin-bottom:12px}
/* product card */
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(214,51,108,.09);text-align:left;border:0;padding:0;display:block;position:relative}
.pimg{position:relative;aspect-ratio:1/1;background:var(--pink-soft);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;color:#e5aac2}
.oos .pimg::after{content:"OUT OF STOCK";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);color:rgba(220,53,69,.95);font:700 17px "Fredoka",sans-serif;transform:rotate(-22deg);text-shadow:0 0 6px #fff,0 0 6px #fff}
.pinfo{padding:9px 10px 11px}
.pname{font-weight:700;font-size:13px;line-height:1.25;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pprice{font:600 18px "Fredoka",sans-serif;color:var(--pink);margin-top:4px}
.pstock{font-size:11px;color:var(--mut)}.pstock.low{color:#e8590c;font-weight:700}
.qadd{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:22px;line-height:1;box-shadow:0 4px 10px rgba(214,51,108,.4);display:flex;align-items:center;justify-content:center}
.oos .qadd{display:none}
/* sheets */
.ov{position:fixed;inset:0;z-index:100;background:rgba(42,34,39,.5);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--pink);font-size:22px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2}
.big{border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:var(--pink-soft);position:relative;max-height:46vh;margin:0 auto}
.big img{width:100%;height:100%;object-fit:cover}
.big.oos::after{content:"OUT OF STOCK";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);color:rgba(220,53,69,.95);font:700 30px "Fredoka",sans-serif;transform:rotate(-22deg);text-shadow:0 0 8px #fff,0 0 8px #fff}
.chip{display:inline-block;font-size:11px;font-weight:800;color:var(--pink);background:var(--pink-soft);border-radius:999px;padding:3px 11px;margin-top:12px}
.dname{font:600 22px "Fredoka",sans-serif;margin-top:6px}
.dprice{font:600 28px "Fredoka",sans-serif;color:var(--pink);margin-top:2px}
.dstock{font-size:14px;margin:4px 0 14px;color:var(--ok);font-weight:700}.dstock.low{color:#e8590c}.dstock.none{color:#d9480f}
.row{display:flex;align-items:center;gap:10px}
.qty{display:flex;align-items:center;background:var(--pink-soft);border-radius:12px;overflow:hidden}
.qty button{width:40px;height:42px;border:0;background:none;color:var(--pink);font-size:22px;font-weight:700}
.qty span{min-width:34px;text-align:center;font-weight:800}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px}
.btn.p{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 6px 16px rgba(214,51,108,.3)}
.btn.s{background:var(--pink-soft);color:var(--pink)}
.btn:disabled{opacity:.5;box-shadow:none}
.grow{flex:1}
/* cart */
.sheet h3{font-size:21px;font-weight:600;color:var(--pink);margin-bottom:10px;padding-right:40px}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item .t{width:62px;height:62px;border-radius:12px;overflow:hidden;background:var(--pink-soft);flex:0 0 auto}
.item .t img{width:100%;height:100%;object-fit:cover}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:14px;line-height:1.25}
.item .m small{color:var(--mut);font-size:12px}
.item .lt{font:600 16px "Fredoka",sans-serif;color:var(--ink);white-space:nowrap}
.item .qty button{width:32px;height:34px;font-size:18px}
.rm{border:0;background:none;color:#d9480f;font-size:20px;padding:4px 6px}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;font:600 20px "Fredoka",sans-serif}
.total strong{color:var(--pink);font-size:26px}
.form{margin-top:10px;display:grid;gap:10px}
.form label{font-size:12px;font-weight:800;color:var(--mut);display:block;margin-bottom:4px}
.form input,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--pink)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px 6px;font-size:12px;font-weight:800;color:var(--mut);text-align:center;line-height:1.25}
.opt.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.opt svg{width:22px;height:22px;margin:0 auto 4px;display:block}
.err{color:#d9480f;font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.done{text-align:center;padding:10px 4px}
.done .ic{width:74px;height:74px;border-radius:50%;margin:6px auto 12px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 20px rgba(214,51,108,.35)}
.done h3{padding:0}.done p{color:var(--mut);margin:6px 0}
.ref{display:inline-block;margin:8px 0 14px;background:var(--pink-soft);color:var(--pink);font:600 18px "Fredoka",sans-serif;border-radius:12px;padding:6px 16px;letter-spacing:1px}
/* confirm */
.conf{z-index:120;align-items:center;padding:20px}
.cbox{background:#fff;border-radius:22px;padding:22px 20px 18px;max-width:340px;width:100%;text-align:center;animation:up .2s ease-out}
.cbox .ic{width:56px;height:56px;border-radius:50%;background:var(--pink-soft);color:var(--pink);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font:700 30px "Fredoka",sans-serif}
.cbox h3{padding:0;margin-bottom:6px}.cbox p{color:var(--mut);font-size:14px;margin-bottom:14px;line-height:1.45}
.cbox .row .btn{flex:1}
/* floating bar + toast */
.fbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:none;max-width:560px;margin:0 auto}
.fbar.show{display:block}
.fbar .btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#2a2227;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:26px 0 10px}

/* search / filter */
.sbwrap{max-width:980px;margin:0 auto;padding:10px 14px 0}
.sbar{display:flex;gap:8px;align-items:center}
.sbar .sin{flex:1;position:relative;min-width:0}
.sbar .sin svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut);pointer-events:none}
.sbar input{width:100%;height:36px;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:0 30px 0 30px;font:inherit;font-size:14px;color:var(--ink)}
.sbar input:focus,.sbar select:focus{outline:none;border-color:var(--pink)}
.sbar .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;border-radius:50%;background:var(--pink-soft);color:var(--pink);font-size:14px;line-height:1;display:none}
.sbar select{height:36px;max-width:42%;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:0 10px;font:inherit;font-size:13px;font-weight:700;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
/* header buttons */
.hbtns{display:flex;gap:8px}
/* ask seller (small symbol) */
.qask{position:absolute;right:7px;top:7px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);padding:0;z-index:2}
.qask svg{width:15px;height:15px}
.askb{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--pink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
.askb svg{width:19px;height:19px}
/* chat fab */
.fab{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;color:var(--pink);padding:9px 14px 9px 11px;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(214,51,108,.3);border:1.5px solid var(--pink-soft)}
.fab svg{width:18px;height:18px}
.fdot{display:none;position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#e03131;border:2px solid #fff}
/* chat */
.cmsgs{height:min(300px,40vh);overflow-y:auto;background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;margin:8px 0}
.cb{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.cb.buyer{align-self:flex-end;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff}
.cb.seller{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.cb small{display:block;opacity:.65;font-size:10px;margin-top:3px}
.cb .pq{display:block;font-size:11px;font-weight:800;margin-bottom:3px;opacity:.9}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px}
.cform input:focus{outline:none;border-color:var(--pink)}
.pchip{display:flex;align-items:center;gap:8px;background:var(--pink-soft);color:var(--pink);border-radius:12px;padding:7px 10px;font-size:12px;font-weight:800;margin-top:6px}
.pchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip button{border:0;background:none;color:var(--pink);font-size:18px;line-height:1}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.contact a{flex:1;min-width:90px;text-align:center;text-decoration:none;background:var(--pink-soft);color:var(--pink);border-radius:12px;padding:9px 10px;font-weight:800;font-size:13px}
.cempty{margin:auto;color:var(--mut);text-align:center;font-size:13px;padding:10px}
/* tracking */
.trrow{display:flex;gap:8px;margin:6px 0}
.trrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:600 16px "Fredoka",sans-serif;letter-spacing:1px;text-transform:uppercase}
.trrow input:focus{outline:none;border-color:var(--pink)}
.rchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.rchips button{border:0;background:var(--pink-soft);color:var(--pink);border-radius:999px;padding:5px 12px;font:600 13px "Fredoka",sans-serif;letter-spacing:.5px}
.steps{margin:14px 0 6px;position:relative}
.stp{display:flex;gap:12px;padding-bottom:16px;position:relative}
.stp:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--line)}
.stp.done:not(:last-child)::before{background:var(--pink)}
.stp .dotc{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;z-index:1}
.stp.done .dotc{background:var(--pink);border-color:var(--pink);color:#fff}
.stp.cur .dotc{box-shadow:0 0 0 5px var(--pink-soft)}
.stp.bad .dotc{background:#e03131;border-color:#e03131;color:#fff}
.stp b{display:block;font-size:15px}.stp small{color:var(--mut);font-size:12px}
.stp:not(.done) b{color:var(--mut);font-weight:700}
.trbox{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13px}
.trbox div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
</style>
</head>
<body>
<header class="hdr">
  <div class="brand"><div class="logo">R</div><div><h1>Raya Store</h1><small>Shop &amp; order online</small></div></div>
  <div class="hbtns"><button class="cart-btn" id="trackBtn" aria-label="Track my order" title="Track my order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><path d="M9 14l2 2 4-4"/></svg></button><button class="cart-btn" id="cartBtn" aria-label="Open cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2.5 3H5l2.7 11.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg><span class="badge" id="badge">0</span></button></div>
</header>

<div class="sbwrap"><div class="sbar"><div class="sin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sq" type="search" placeholder="Search products" autocomplete="off" enterkeyhint="search"><button class="sx" id="sqx" type="button" aria-label="Clear search">×</button></div><select id="scat" aria-label="Filter by category"><option value="">All categories</option></select></div></div>
<div class="wrap" id="app"><div class="state">Loading store…</div></div>
<div class="foot">© Raya Store</div>

<div class="fbar" id="fbar"><button class="btn p" id="fbarBtn"><span id="fbarTxt">View cart</span><strong id="fbarTotal"></strong></button></div>

<div class="ov" id="prodOv"><div class="sheet" id="prodSheet"></div></div>
<div class="ov" id="cartOv"><div class="sheet" id="cartSheet"></div></div>
<div class="ov conf" id="confOv"><div class="cbox" id="confBox"></div></div>
<div class="ov" id="chatOv"><div class="sheet" id="chatSheet"></div></div>
<div class="ov" id="trackOv"><div class="sheet" id="trackSheet"></div></div>
<button class="fab" id="chatFab" aria-label="Message us" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Message us</span><i class="fdot" id="fdot"></i></button>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const money=v=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(Number(v)||0);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const cfg=window.SUPABASE_CONFIG||{url:window.SUPABASE_URL,anonKey:window.SUPABASE_ANON_KEY};
const cfgBad=!cfg||!cfg.url||!cfg.anonKey||String(cfg.url).includes("YOUR-PROJECT-REF")||String(cfg.anonKey).includes("YOUR_SUPABASE");
let db=null;if(!cfgBad&&window.supabase&&window.supabase.createClient)db=window.supabase.createClient(cfg.url,cfg.anonKey);

let products=[],ads=[],tops=[],cart=[];
const CART_KEY='raya_buyer_cart',INFO_KEY='raya_buyer_info';
try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]')||[];}catch(e){cart=[];}
const saveCart=()=>{try{localStorage.setItem(CART_KEY,JSON.stringify(cart));}catch(e){}};
const prod=id=>products.find(p=>String(p.id)===String(id));
const stockOf=p=>Math.max(0,Number(p&&p.stock)||0);
const imgOf=(p,cls)=>p&&p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.outerHTML=\'<div class=ph>▣</div>\'">':'<div class="ph">▣</div>';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800);}

/* ---------- cart helpers ---------- */
function cleanCart(){cart=cart.filter(i=>prod(i.id)&&stockOf(prod(i.id))>0).map(i=>({id:i.id,qty:Math.min(Math.max(1,parseInt(i.qty,10)||1),stockOf(prod(i.id)))}));saveCart();}
const cartCount=()=>cart.reduce((s,i)=>s+i.qty,0);
const cartTotal=()=>cart.reduce((s,i)=>s+(Number(prod(i.id)?.price)||0)*i.qty,0);
function addToCart(id,qty){const p=prod(id);if(!p)return false;const max=stockOf(p);const ex=cart.find(i=>String(i.id)===String(id));const have=ex?ex.qty:0;
 if(have+qty>max){toast(have>=max?'You already have all available stock in your cart':'Only '+max+' available');return false;}
 if(ex)ex.qty+=qty;else cart.push({id:p.id,qty});saveCart();refreshCartUi();return true;}
function refreshCartUi(){const n=cartCount();const b=$('badge');b.textContent=n;b.style.display=n?'flex':'none';
 $('fbar').classList.toggle('show',n>0&&!document.querySelector('.ov.show'));
 $('fbarTxt').textContent='View cart · '+n+' item'+(n===1?'':'s');$('fbarTotal').textContent=money(cartTotal());}

/* ---------- carousel ---------- */
function carousel(id){const tr=$(id);if(!tr)return;const slides=tr.children.length;const dots=tr.parentElement.querySelectorAll('.dot');let idx=0,pause=0;
 const go=i=>{tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'});};
 tr.addEventListener('scroll',()=>{idx=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));dots.forEach((d,k)=>d.classList.toggle('on',k===idx));});
 dots.forEach((d,k)=>d.addEventListener('click',()=>{pause=Date.now()+8000;go(k);}));
 ['touchstart','pointerdown','wheel'].forEach(ev=>tr.addEventListener(ev,()=>{pause=Date.now()+8000;},{passive:true}));
 if(slides>1)setInterval(()=>{if(Date.now()<pause||document.hidden)return;go((idx+1)%slides);},4500);}

/* ---------- render ---------- */
const ASK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
let searchQ='',catFilter='';
function card(p){const s=stockOf(p);return '<div class="card'+(s<=0?' oos':'')+'" data-id="'+esc(p.id)+'" role="button" tabindex="0"><div class="pimg">'+imgOf(p)+'<button class="qask" type="button" data-ask="'+esc(p.id)+'" aria-label="Ask seller about this product" title="Ask seller">'+ASK_SVG+'</button></div><div class="pinfo"><div class="pname">'+esc(p.name)+'</div><div class="pprice">'+money(p.price)+'</div><div class="pstock'+(s>0&&s<=5?' low':'')+'">'+(s<=0?'Out of stock':s+' available')+'</div></div>'+(s>0?'<button class="qadd" data-add="'+esc(p.id)+'" aria-label="Add to cart">+</button>':'')+'</div>';}
const catOf=p=>(p.category||'').trim()||'Others';
const FOOD=/food|snack|chocolate|candy|candies|sweet|milk|dairy|drink|beverage|juice|coffee|tea|water|soda|canned|noodle|pasta|rice|bread|biscuit|cookie|cracker|chip|cereal|sauce|condiment|spice|oil|egg|meat|fish|seafood|vegetable|fruit|frozen|instant|grocer|dessert|cake|jelly|sugar|salt|ice cream|chicken|pork|beef|bakery|pantry/i;
function orderedCats(){
 const groups={};products.forEach(p=>{(groups[catOf(p)]=groups[catOf(p)]||[]).push(p);});
 const sold={};tops.forEach(t=>{const p=prod(t.product_id);if(p){const c=catOf(p);sold[c]=(sold[c]||0)+(Number(t.units_sold)||0);}});
 const tier=c=>c==='Others'?3:(sold[c]>0?0:(FOOD.test(c)?1:2));
 const names=Object.keys(groups).sort((a,b)=>tier(a)-tier(b)||(tier(a)===0?(sold[b]-sold[a]):0)||a.localeCompare(b,undefined,{sensitivity:'base'}));
 return {groups,names};}
function syncFilterBar(names){const sel=$('scat');if(!sel)return;if(catFilter&&!names.includes(catFilter))catFilter='';
 sel.innerHTML='<option value="">All categories</option>'+names.map(n=>'<option value="'+esc(n)+'"'+(n===catFilter?' selected':'')+'>'+esc(n)+'</option>').join('');sel.value=catFilter;
 $('sqx').style.display=searchQ?'block':'none';}
function render(){
 const app=$('app');let h='';
 const {groups,names}=orderedCats();syncFilterBar(names);
 const q=searchQ.trim().toLowerCase(),filtering=!!(q||catFilter);
 if(!filtering){
  if(ads.length)h+='<div class="ads"><div class="ads-track" id="adsTrack">'+ads.map(a=>'<div class="ad">'+(a.image_url?'<img src="'+esc(a.image_url)+'" alt="'+esc(a.title||'Promo')+'" draggable="false">':'')+'</div>').join('')+'</div>'+(ads.length>1?'<div class="dots">'+ads.map((a,i)=>'<button class="dot'+(i===0?' on':'')+'" aria-label="Ad '+(i+1)+'"></button>').join('')+'</div>':'')+'</div>';
  const topList=tops.map(t=>prod(t.product_id)).filter(Boolean).slice(0,12);
  if(topList.length)h+='<section class="sec"><div class="sec-h"><h2>Top Sellers</h2><span class="sub">Swipe →</span></div><div class="hrow">'+topList.map(card).join('')+'</div></section>';}
 if(q){
  let res=products.filter(p=>(!catFilter||catOf(p)===catFilter)&&(String(p.name||'').toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q)));
  res.sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{sensitivity:'base'}));
  h+='<section class="sec"><div class="sec-h"><h2>Results</h2><span class="sub">'+res.length+' item'+(res.length===1?'':'s')+'</span></div>'+(res.length?'<div class="grid">'+res.map(card).join('')+'</div>':'<div class="state" style="margin-top:0">No products found for “'+esc(searchQ.trim())+'”.<br><small>Try another word, or message us and we will help.</small></div>')+'</section>';
 }else{
  const shown=catFilter?[catFilter]:names;
  if(shown.length){h+='<section class="sec"><div class="sec-h"><h2>Categories</h2><span class="sub">'+(catFilter?'Showing '+esc(catFilter):'Tap a category to expand')+'</span></div>';
   shown.forEach((c,i)=>{const list=(groups[c]||[]).slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{sensitivity:'base'}));const ex=!!catFilter;
    h+='<div class="cat'+(ex?' expanded':'')+'" data-cat="'+names.indexOf(c)+'"><button class="cat-h" type="button"><span><span class="n">'+esc(c)+'</span><span class="c">'+list.length+' item'+(list.length===1?'':'s')+'</span></span><span class="x">'+(ex?'Collapse ▴':'Expand ▾')+'</span></button><div class="hrow">'+list.map(card).join('')+'</div></div>';});
   h+='</section>';}
 }
 if(!products.length)h+='<div class="state">No products yet. Please check back soon.</div>';
 app.innerHTML=h;carousel('adsTrack');refreshCartUi();}

const ICON={Delivery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',Pickup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 14h6"/></svg>',Meetup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>'};
function openCart(){$('cartOv').classList.add('show');$('fbar').classList.remove('show');renderCart();}
function closeCart(){$('cartOv').classList.remove('show');refreshCartUi();}
function renderCart(){cleanCart();const sh=$('cartSheet');
 let info={};try{info=JSON.parse(localStorage.getItem(INFO_KEY)||'{}')||{};}catch(e){}
 if(!cart.length){sh.innerHTML='<button class="close" id="cClose" aria-label="Close">×</button><h3>Your Cart</h3><div class="empty">Your cart is empty.<br>Tap a product to add it.</div><button class="btn p" style="width:100%" id="cShop">Continue shopping</button>';

 const needAddr=delivery!=='Pickup';
 sh.innerHTML='<button class="close" id="cClose" aria-label="Close">×</button><h3>Your Cart</h3>'+rows+'<div class="total"><span>Total</span><strong>'+money(cartTotal())+'</strong></div>'

 $('cClose').onclick=closeCart;refreshCartUi();$('fbar').classList.remove('show');

function startCheckout(){
 const name=$('fName').value.trim(),phone=$('fPhone').value.trim(),addr=$('fAddr')?$('fAddr').value.trim():'',note=$('fNote').value.trim(),err=$('cErr');
 if(!name){err.textContent='Please enter your name.';return;}
 if(delivery!=='Pickup'&&!addr){err.textContent='Please enter the '+(delivery==='Meet-up'?'meet-up location':'delivery address')+'.';return;}
 err.textContent='';
 try{localStorage.setItem(INFO_KEY,JSON.stringify({name,phone,addr}));}catch(e){}
 const where=delivery==='Pickup'?'Pick up at the store':(delivery==='Meet-up'?'Meet-up: ':'Deliver to: ')+addr;
 $('confBox').innerHTML='<div class="ic">?</div><h3>Send this order?</h3><p>'+cartCount()+' item'+(cartCount()===1?'':'s')+' · <b>'+money(cartTotal())+'</b><br>'+esc(where)+'<br>The store will receive your order and contact you.</p><div class="row"><button class="btn s" id="cNo">Cancel</button><button class="btn p" id="cYes">Yes, send</button></div>';
 $('confOv').classList.add('show');
 $('cNo').onclick=()=>$('confOv').classList.remove('show');
 $('cYes').onclick=async()=>{const yes=$('cYes');yes.disabled=true;yes.textContent='Sending…';
  try{
   if(!db)throw new Error('Store is not connected. Please try again later.');
   const {data,error}=await db.rpc('place_checkout',{p_buyer_name:name,p_phone:phone,p_delivery_method:delivery,p_address:addr,p_note:note,p_items:cart.map(i=>({product_id:i.id,quantity:i.qty}))});
   if(error)throw error;
   const ref=String(data||'').replace(/-/g,'').slice(0,8).toUpperCase();
   const total=cartTotal(),n=cartCount();
   const receipt={ref,name,phone,method:delivery,addr,total,date:new Date(),items:cart.map(i=>{const pp=prod(i.id)||{};return {name:pp.name||'Item',qty:i.qty,line:(Number(pp.price)||0)*i.qty};})};
   window.lastReceipt=receipt;saveRef(ref,total);
   cart=[];saveCart();$('confOv').classList.remove('show');
   $('cartSheet').innerHTML='<div class="done"><div class="ic">✓</div><h3>Order sent!</h3><p>Thank you, '+esc(name)+'. The store received your order of '+n+' item'+(n===1?'':'s')+' ('+money(total)+').</p><div class="ref">'+esc(ref||'SENT')+'</div><p>Keep this reference number. '+(phone?'We will contact you at '+esc(phone)+'.':'The store will see your order shortly.')+'</p><button class="btn p" style="width:100%" id="dDl">⬇ Download reference</button><div class="row" style="margin-top:8px"><button class="btn s grow" id="dTrack">Track order</button><button class="btn s grow" id="dDone">Back to shop</button></div></div>';
   $('dDl').onclick=()=>downloadReceipt(receipt);$('dTrack').onclick=()=>{closeCart();openTrack(ref);};
   $('dDone').onclick=closeCart;refreshCartUi();load(true);
  }catch(e){$('confOv').classList.remove('show');$('cErr').textContent=(e&&e.message)||'Could not send the order. Please try again.';load(true);}
 };}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const ask=e.target.closest('[data-ask]');if(ask){e.stopPropagation();const pp=prod(ask.dataset.ask);if(pp)openChat(pp);return;}
 const add=e.target.closest('[data-add]');if(add){e.stopPropagation();if(addToCart(add.dataset.add,1))toast('Added to cart');return;}
 const hd=e.target.closest('.cat-h');if(hd){const c=hd.parentElement;const ex=c.classList.toggle('expanded');hd.querySelector('.x').textContent=ex?'Collapse ▴':'Expand ▾';return;}
 const cd=e.target.closest('.card[data-id]');if(cd&&!e.target.closest('.ov')){openProduct(cd.dataset.id);return;}
 const m=e.target.closest('[data-m]'),pl=e.target.closest('[data-p]'),rm=e.target.closest('[data-r]'),dl=e.target.closest('[data-d]');
 if(m){const i=cart.find(x=>String(x.id)===String(m.dataset.m));if(i){i.qty--;if(i.qty<1)cart=cart.filter(x=>x!==i);saveCart();renderCart();}return;}
 if(pl){const i=cart.find(x=>String(x.id)===String(pl.dataset.p));if(i){if(i.qty>=stockOf(prod(i.id)))toast('Only '+stockOf(prod(i.id))+' available');else{i.qty++;saveCart();renderCart();}}return;}
 if(rm){cart=cart.filter(x=>String(x.id)!==String(rm.dataset.r));saveCart();renderCart();return;}
 if(dl){delivery=dl.dataset.d;const keep={n:$('fName').value,p:$('fPhone').value,a:$('fAddr')?$('fAddr').value:'',t:$('fNote').value};renderCart();$('fName').value=keep.n;$('fPhone').value=keep.p;if($('fAddr'))$('fAddr').value=keep.a;$('fNote').value=keep.t;return;}
 if(e.target===$('chatOv'))closeChat();if(e.target===$('trackOv'))closeTrack();if(e.target===$('prodOv'))closeProduct();if(e.target===$('cartOv'))closeCart();if(e.target===$('confOv'))$('confOv').classList.remove('show');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeChat();closeTrack();closeProduct();closeCart();$('confOv').classList.remove('show');}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-id]')){e.preventDefault();openProduct(e.target.dataset.id);}});
$('cartBtn').onclick=openCart;$('fbarBtn').onclick=openCart;

/* ---------- data ---------- */
async function load(quiet){
 if(!db){$('app').innerHTML='<div class="state"><b>Store not connected.</b><br>Open <code>config.js</code> and enter your Supabase URL and public key.</div>';return;}
 try{
  const [pr,ad,ts]=await Promise.all([
   db.from('public_products').select('*').order('name'),
   db.from('ads').select('*').order('sort_order').order('created_at'),
   db.from('public_top_sellers').select('*').order('units_sold',{ascending:false}).limit(12)]);
  if(pr.error)throw pr.error;
  products=(pr.data||[]).filter(p=>stockOf(p)>0);ads=ad.error?[]:(ad.data||[]);tops=ts.error?[]:(ts.data||[]);
  cleanCart();
  if(quiet&&$('app').children.length>1){/* keep scroll position */const y=scrollY;const open=[...document.querySelectorAll('.cat.expanded')].map(c=>c.dataset.cat);render();open.forEach(i=>{const c=document.querySelector('.cat[data-cat="'+i+'"]');if(c){c.classList.add('expanded');c.querySelector('.x').textContent='Collapse ▴';}});scrollTo(0,y);}
  else render();
 }catch(e){if(!quiet)$('app').innerHTML='<div class="state"><b>The store is not ready yet.</b><br>'+esc((e&&e.message)||'Please try again later.')+'</div>';}
}

  +(contact?'<div class="contact" style="margin-top:8px">'+contact+'</div>':'')
  +'<div class="cmsgs" id="cMsgs"><div class="cempty">Loading…</div></div><div id="cCtx"></div>'
  +(info.name?'':'<input id="cName" placeholder="Your name" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;margin:8px 0 0" autocomplete="name">')
  +'<form class="cform" id="cForm" style="margin-top:8px"><input id="cIn" placeholder="Type your message…" maxlength="600" autocomplete="off"><button class="btn p" type="submit" aria-label="Send" style="padding:0 16px">'+svgSend+'</button></form><div class="err" id="cErr2"></div>';
 $('chatOv').classList.add('show');paintCtx();
 $('chClose').onclick=closeChat;$('cForm').onsubmit=sendChat;
 chatFetch(true);clearInterval(chatTimer);chatTimer=setInterval(()=>chatFetch(false),4000);
 setTimeout(()=>$('cIn')&&$('cIn').focus(),80);}
function paintCtx(){const el=$('cCtx');if(!el)return;el.innerHTML=chatCtx?'<div class="pchip"><span>Asking about: '+esc(chatCtx.name)+'</span><button type="button" id="cCtxX" aria-label="Remove">×</button></div>':'';const x=$('cCtxX');if(x)x.onclick=()=>{chatCtx=null;paintCtx();};}
function closeChat(){$('chatOv').classList.remove('show');clearInterval(chatTimer);chatTimer=null;markChatSeen();}
function markChatSeen(){try{localStorage.setItem(CHAT_SEEN,String(chatMsgs.filter(m=>m.sender==='seller').length));}catch(e){}$('fdot').style.display='none';}
async function chatFetch(first){
 if(!db||!hasThread()){if(first&&$('cMsgs'))$('cMsgs').innerHTML='<div class="cempty">Say hello 👋 — we usually reply soon.</div>';return;}
 try{const {data,error}=await db.rpc('chat_fetch',{p_thread:threadId()});if(error)throw error;chatMsgs=data||[];}
 catch(e){if(first&&$('cMsgs'))$('cMsgs').innerHTML='<div class="cempty">Chat is not available right now.</div>';return;}
 paintChat();}
function paintChat(){const el=$('cMsgs');if(!el||!$('chatOv').classList.contains('show'))return;
 const sig=chatMsgs.length+':'+(chatMsgs.length?chatMsgs[chatMsgs.length-1].id:'');if(el.dataset.sig===sig)return;
 const atEnd=el.scrollHeight-el.scrollTop-el.clientHeight<80||!el.dataset.sig;el.dataset.sig=sig;
 el.innerHTML=chatMsgs.length?chatMsgs.map(m=>'<div class="cb '+m.sender+'">'+(m.product_name?'<span class="pq">Re: '+esc(m.product_name)+'</span>':'')+esc(m.body)+'<small>'+cTime(m.created_at)+'</small></div>').join(''):'<div class="cempty">Say hello 👋 — we usually reply soon.</div>';
 if(atEnd)el.scrollTop=el.scrollHeight;markChatSeen();}
async function sendChat(e){e.preventDefault();const inp=$('cIn'),body=inp.value.trim(),err=$('cErr2');if(!body)return;
 let info={};try{info=JSON.parse(localStorage.getItem(INFO_KEY)||'{}')||{};}catch(x){}
 let name=info.name||($('cName')?$('cName').value.trim():'');
 if(!name){err.textContent='Please enter your name so we know who to reply to.';$('cName')&&$('cName').focus();return;}
 if(!info.name){try{info.name=name;localStorage.setItem(INFO_KEY,JSON.stringify(info));}catch(x){}const cn=$('cName');if(cn)cn.remove();}
 err.textContent='';inp.value='';
 try{if(!db)throw new Error('Store is not connected.');
  const {error}=await db.rpc('chat_send',{p_thread:threadId(),p_name:name,p_body:body,p_product_id:chatCtx?String(chatCtx.id):null,p_product_name:chatCtx?chatCtx.name:null});
  if(error)throw error;chatCtx=null;paintCtx();await chatFetch(false);}
 catch(ex){inp.value=body;err.textContent=(ex&&ex.message)||'Could not send. Please try again.';}}
$('chatFab').onclick=()=>openChat(null);
async function chatPoll(){if(!db||!hasThread()||$('chatOv').classList.contains('show'))return;
 try{const {data,error}=await db.rpc('chat_fetch',{p_thread:threadId()});if(error)return;chatMsgs=data||[];
  let seen=0;try{seen=parseInt(localStorage.getItem(CHAT_SEEN)||'0',10)||0;}catch(e){}
  const n=chatMsgs.filter(m=>m.sender==='seller').length;
  if(n>seen){if($('fdot').style.display!=='block')toast('The seller replied to your message');$('fdot').style.display='block';}}catch(e){}}
setInterval(chatPoll,20000);setTimeout(chatPoll,2500);

/* ---------- order tracking ---------- */
const REF_KEY='raya_refs';
function getRefs(){try{return JSON.parse(localStorage.getItem(REF_KEY)||'[]')||[];}catch(e){return [];}}
function saveRef(ref,total){if(!ref)return;let a=getRefs().filter(r=>r.ref!==ref);a.unshift({ref,total,at:Date.now()});try{localStorage.setItem(REF_KEY,JSON.stringify(a.slice(0,8)));}catch(e){}}
let trTimer=null,trRef='';
function openTrack(ref){
 const refs=getRefs();
 $('trackSheet').innerHTML='<button class="close" id="trClose" aria-label="Close">×</button><h3>Track your order</h3><small style="color:var(--mut)">Enter the reference number you received after checkout.</small>'
  +'<form class="trrow" id="trForm"><input id="trIn" placeholder="e.g. 3F9A12BC" maxlength="12" autocomplete="off" autocapitalize="characters" value="'+esc(ref||'')+'"><button class="btn p" type="submit">Track</button></form>'
  +(refs.length?'<div class="rchips">'+refs.map(r=>'<button type="button" data-tr="'+esc(r.ref)+'">'+esc(r.ref)+'</button>').join('')+'</div>':'')
  +'<div id="trOut"></div>';
 $('trackOv').classList.add('show');
 $('trClose').onclick=closeTrack;
 $('trForm').onsubmit=e=>{e.preventDefault();doTrack($('trIn').value);};
 $('trackSheet').querySelectorAll('[data-tr]').forEach(x=>x.onclick=()=>{$('trIn').value=x.dataset.tr;doTrack(x.dataset.tr);});
 clearInterval(trTimer);trTimer=setInterval(()=>{if(trRef&&$('trackOv').classList.contains('show'))doTrack(trRef,true);},15000);
 if(ref)doTrack(ref);else setTimeout(()=>$('trIn')&&$('trIn').focus(),80);}
function closeTrack(){$('trackOv').classList.remove('show');clearInterval(trTimer);trTimer=null;}
async function doTrack(raw,quiet){
 const ref=String(raw||'').replace(/[^0-9a-zA-Z]/g,'').toUpperCase(),out=$('trOut');if(!out)return;
 if(ref.length<8){out.innerHTML='<div class="err">Please enter the full 8-character reference number.</div>';return;}
 if(!quiet)out.innerHTML='<div class="empty">Checking…</div>';
 try{if(!db)throw new Error('Store is not connected.');
  const {data,error}=await db.rpc('track_checkout',{p_ref:ref});if(error)throw error;
  if(!data){trRef='';out.innerHTML='<div class="state" style="margin-top:8px">We could not find that reference number.<br><small>Please check it and try again.</small></div>';return;}
  trRef=ref;renderTrack(data);
 }catch(e){if(!quiet)out.innerHTML='<div class="err">'+esc((e&&e.message)||'Could not check your order. Please try again.')+'</div>';}}
function renderTrack(o){
 const hist=Array.isArray(o.history)?o.history:[],at=s=>{const h=hist.filter(x=>x.status===s).pop();return h?h.at:(s==='Pending'?o.created_at:null);};
 const flow=[['Pending','Order received'],['Confirmed','Order confirmed'],['Delivered',o.delivery_method==='Pickup'?'Ready / picked up':'Delivered']];
 const cancelled=o.status==='Cancelled',idx=flow.findIndex(f=>f[0]===o.status);
 let steps=flow.map((f,i)=>{const done=!cancelled?i<=idx:i===0;const t=at(f[0]);return '<div class="stp'+(done?' done':'')+(!cancelled&&i===idx?' cur':'')+'"><div class="dotc">✓</div><div><b>'+f[1]+'</b><small>'+(t&&done?cTime(t):'Waiting')+'</small></div></div>';}).join('');
 if(cancelled)steps+='<div class="stp bad cur"><div class="dotc">✕</div><div><b>Order cancelled</b><small>'+cTime(at('Cancelled')||o.updated_at)+'</small></div></div>';
 const items=(Array.isArray(o.items)?o.items:[]).map(x=>'<div><span>'+esc(x.name)+' × '+(Number(x.quantity)||0)+'</span><b>'+money(x.line_total)+'</b></div>').join('');
 $('trOut').innerHTML='<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><span class="ref" style="margin:0">'+esc(o.ref)+'</span><small style="color:var(--mut)">Hi '+esc(o.buyer_name||'there')+'!</small></div>'
  +'<div class="steps">'+steps+'</div>'
  +'<div class="trbox">'+items+'<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px"><span>Total · '+esc(o.delivery_method||'')+'</span><b style="color:var(--pink)">'+money(o.total)+'</b></div></div>'
  +'<small style="display:block;color:var(--mut);margin-top:8px;text-align:center">Last update: '+cTime(o.updated_at||o.created_at)+' · refreshes automatically</small>';}
$('trackBtn').onclick=()=>openTrack('');
(function(){try{const r=new URLSearchParams(location.search).get('ref');if(r)setTimeout(()=>openTrack(r),400);}catch(e){}})();

/* ---------- downloadable order reference (PNG) ---------- */
function downloadReceipt(r){
 try{const W=720,pad=40,rowH=34,H=520+r.items.length*rowH+(r.addr?30:0),cv=document.createElement('canvas'),sc=2;cv.width=W*sc;cv.height=H*sc;
  const c=cv.getContext('2d');c.scale(sc,sc);const F=(w,s)=>w+' '+s+'px "Fredoka","Nunito","Segoe UI",Arial,sans-serif';
  c.fillStyle='#fdf4f8';c.fillRect(0,0,W,H);
  const g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#d6336c');g.addColorStop(1,'#f06595');c.fillStyle=g;c.fillRect(0,0,W,120);
  c.fillStyle='#fff';c.font=F('700',40);c.textBaseline='middle';c.fillText('Raya Store',pad,50);c.font=F('400',20);c.fillText('Order Reference',pad,88);
  c.fillStyle='#fff';c.beginPath();c.roundRect?c.roundRect(pad,150,W-pad*2,110,18):c.rect(pad,150,W-pad*2,110);c.fill();
  c.fillStyle='#7b6b73';c.font=F('600',17);c.textAlign='center';c.fillText('YOUR REFERENCE NUMBER',W/2,176);
  c.fillStyle='#d6336c';c.font=F('700',54);c.fillText(r.ref,W/2,224);c.textAlign='left';
  let y=300;const line=(k,v)=>{c.fillStyle='#7b6b73';c.font=F('600',17);c.fillText(k,pad,y);c.fillStyle='#2a2227';c.font=F('600',18);c.textAlign='right';c.fillText(v,W-pad,y);c.textAlign='left';y+=32;};
  const fit=(t,max)=>{t=String(t);while(c.measureText(t).width>max&&t.length>3)t=t.slice(0,-2);return t;};
  line('Date',new Intl.DateTimeFormat('en-PH',{dateStyle:'medium',timeStyle:'short'}).format(r.date));
  line('Name',fit(r.name,420));
  line('Option',r.method==='Pickup'?'Pick up at store':r.method);
  if(r.addr){c.font=F('600',18);line(r.method==='Meet-up'?'Meet-up':'Deliver to',fit(r.addr,420));}
  y+=8;c.strokeStyle='#f0dbe5';c.lineWidth=2;c.beginPath();c.moveTo(pad,y);c.lineTo(W-pad,y);c.stroke();y+=28;
  r.items.forEach(it=>{c.fillStyle='#2a2227';c.font=F('600',18);c.textAlign='left';c.fillText(fit(it.qty+' × '+it.name,W-pad*2-150),pad,y);c.textAlign='right';c.fillText(money(it.line),W-pad,y);c.textAlign='left';y+=rowH;});
  y+=4;c.beginPath();c.moveTo(pad,y);c.lineTo(W-pad,y);c.stroke();y+=34;
  c.fillStyle='#2a2227';c.font=F('600',24);c.fillText('Total',pad,y);c.fillStyle='#d6336c';c.font=F('700',32);c.textAlign='right';c.fillText(money(r.total),W-pad,y);c.textAlign='left';y+=52;
  c.fillStyle='#7b6b73';c.font=F('600',16);c.textAlign='center';c.fillText('Track your order anytime with this reference number.',W/2,y);y+=26;
  c.fillText(location.origin+location.pathname,W/2,y);
  const name='Raya-Order-'+r.ref+'.png';
  cv.toBlob(bl=>{if(!bl){window.open(cv.toDataURL('image/png'));return;}const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Reference downloaded');},'image/png');
 }catch(e){toast('Could not create the file. Please take a screenshot of your reference.');}}

load();
</script>
